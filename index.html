<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙溪高中 × 社會領域 × 兒童人權特展</title>
    <meta name="description" content="雙溪高中兒童人權特展入口網頁，整合 CRC 拍貼機、體感遊戲、找碴遊戲、記憶力翻牌與頭貼產生器。">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sticker-background" class="sticker-background"></div>
    <div class="bg-glow"></div>
    
    <main class="container">
        <header class="hero">
            <h1 id="main-title">雙溪高中 × 社會領域 × 兒童人權特展</h1>
            <p class="subtitle">SXHS × Social Studies × CRC</p>
        </header>

        <section class="portal-grid">
            <!-- 1. 記憶力翻牌 -->
            <a href="https://gongminshenliyuchiutiger.github.io/crc-memory/" class="portal-card" id="link-memory" style="--accent: #ff0080;">
                <div class="icon-box"><i class="fa-solid fa-brain"></i></div>
                <div class="card-content">
                    <h3>兒童權利記憶力翻牌</h3>
                    <p>翻開知識，挑戰你的記憶極限</p>
                </div>
                <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

            <!-- 2. 偵探找碴 -->
            <a href="https://gongminshenliyuchiutiger.github.io/crc-detective/" class="portal-card" id="link-detective" style="--accent: #ffcc00;">
                <div class="icon-box"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="card-content">
                    <h3>兒童權利偵探找碴</h3>
                    <p>火眼金睛！找出隱藏的權利秘密</p>
                </div>
                <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

            <!-- 3. 體感保衛戰 -->
            <a href="https://gongminshenliyuchiutiger.github.io/motion-crc/" class="portal-card" id="link-motion-game" style="--accent: #00ff88;">
                <div class="icon-box"><i class="fa-solid fa-person-running"></i></div>
                <div class="card-content">
                    <h3>體感兒童人權保衛戰</h3>
                    <p>全身動起來，守護兒童未來</p>
                </div>
                <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

            <!-- 4. 拍貼機 -->
            <a href="https://gongminshenliyuchiutiger.github.io/motion-sxhs-crc-photo-booth/" class="portal-card" id="link-photo-booth" style="--accent: #00d2ff;">
                <div class="icon-box"><i class="fa-solid fa-camera-retro"></i></div>
                <div class="card-content">
                    <h3>CRC 拍貼機系統</h3>
                    <p>留下最燦爛的笑容與權利宣言</p>
                </div>
                <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

            <!-- 5. 頭貼產生器 -->
            <a href="https://gongminshenliyuchiutiger.github.io/sxhs-crc-profilepic/" class="portal-card" id="link-profile-gen" style="--accent: #9d50bb;">
                <div class="icon-box"><i class="fa-solid fa-id-badge"></i></div>
                <div class="card-content">
                    <h3>CRC 頭貼產生器</h3>
                    <p>設計專屬頭像，展現個人風格</p>
                </div>
                <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
        </section>

        <footer class="footer">
            <p>Copyright © Liyuchiutiger Gongminshen</p>
        </footer>
    </main>

    <!-- Mascot -->
    <div id="mascot-container" class="mascot-container">
        <img src="image/LiyuChillGuy.svg" alt="LiyuChillGuy" id="mascot-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
